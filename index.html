<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="정민채 포트폴리오: 콘텐츠 기획 · 마케팅 · 영상">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>정민채 포트폴리오 스크롤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 흰 바탕 스크롤 스토리.
   고정 히어로(이름이 갈라지고 민트 프레임이 화면을 채움) → 단어가 밝아지는 소개 → 키워드 띠
   → 3D: 공용 모델→일러스트→성형본 3단계 고정 시퀀스 → 콘텐츠: 이미지가 열리며 등장하는 챕터
   → 영상: 세로 스크롤로 가로로 흐르는 카드 트랙(폰은 스와이프) → About → 연락처 */
:root{
  --bg:#FFFFFF; --ink:#111615; --soft:#3E4846; --muted:#6B7674; --line:#E5EAE9; --tint:#F2F7F6; --dim:#BCC5C3;
  --accent:#12A594; --accent-ink:#0A7065; --on-accent:#FFFFFF;
  --f-latin:"Unbounded","Noto Sans KR",system-ui,sans-serif;
  --f-num:"Unbounded","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --wrap:1200px; --r:14px; --vh:100vh;
  color-scheme:light;
}
@supports (height:100svh){:root{--vh:100svh}}
/* shared pieces: placeholders, detail content, profile rows */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.75;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4,h5{text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}

.ph{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:var(--tint);border-radius:var(--r);overflow:hidden;display:flex;align-items:flex-end}
.ph-tall{aspect-ratio:3/4}.ph-story{aspect-ratio:9/16}.ph-sq{aspect-ratio:1}.ph-wide{aspect-ratio:16/9}.ph-card{aspect-ratio:4/3}
.ph::before,.ph::after{content:"";position:absolute;width:18px;height:18px;border:1.5px solid var(--accent);opacity:.55}
.ph::before{top:12px;left:12px;border-right:0;border-bottom:0}
.ph::after{bottom:12px;right:12px;border-left:0;border-top:0}
.ph span{position:relative;margin:14px 16px;font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.04em;color:var(--muted)}
.thumbs{display:grid;gap:8px;margin-top:8px}
.thumbs.n1{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.thumbs.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.thumbs.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.thumbs .ph span{margin:10px;font-size:.625rem}
.thumbs .ph::before,.thumbs .ph::after{width:10px;height:10px}
.thumbs .ph::before{top:8px;left:8px}.thumbs .ph::after{bottom:8px;right:8px}
.cap{margin-top:8px;font-size:.75rem;color:var(--muted)}

.dbody{display:grid;gap:18px;font-size:.9375rem;min-width:0;align-content:start}
.dbody h5{font-size:.8125rem;font-weight:700;letter-spacing:.02em;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.stats div{background:var(--tint);border-radius:10px;padding:14px 16px}
.stats b{display:block;font-family:var(--f-num);font-size:1.5rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ink)}
.stats span{font-size:.75rem;color:var(--muted)}
.note{font-size:.8125rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(0,8.5rem) minmax(0,1fr);gap:10px 20px;margin:0;border-top:1px solid var(--line);padding-top:16px}
.kv dt{font-weight:700;font-size:.875rem}
.kv dd{margin:0;color:var(--soft);min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}}
.steps{margin:0;padding-left:1.3em;display:grid;gap:6px;color:var(--soft)}
.steps strong{color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.links a{font-size:.8125rem;font-weight:500;text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);transition:background .2s,color .2s}
.links a:hover{background:var(--ink);color:var(--bg)}

.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.9375rem}
.rows>li{display:grid;grid-template-columns:minmax(0,6.75rem) minmax(0,1fr);gap:12px;min-width:0}
.rows>li>*{min-width:0;overflow-wrap:anywhere}
@container (max-width:360px){.rows>li{grid-template-columns:minmax(0,1fr);gap:0}.rows .when{padding-top:0}}
.rows .when{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.rows ul{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:2px;color:var(--muted);font-size:.875rem}
.skills strong{font-weight:700}
.pblock h4{font-family:var(--f-mono);font-size:.75rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:14px}
.copy{font:inherit;font-size:.75rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.copy:hover{border-color:var(--ink);color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.ph.has-img{background:var(--tint)}
.ph.has-img::before,.ph.has-img::after{display:none}
.ph img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;display:block}

/* zoomable images + lightbox */
.ph.has-img[tabindex]{cursor:zoom-in}
.ph.has-img[tabindex]::after{display:grid;place-items:center;content:"⤢";position:absolute;right:10px;bottom:10px;left:auto;top:auto;width:28px;height:28px;border:0;border-radius:50%;
  background:rgba(17,22,21,.68);color:#fff;font-size:15px;line-height:1;opacity:.9;transition:transform .2s,opacity .2s}
.thumbs .ph.has-img[tabindex]::after{width:22px;height:22px;right:6px;bottom:6px;font-size:12px}
.ph.has-img[tabindex]:hover::after,.ph.has-img[tabindex]:focus-visible::after{opacity:1;transform:scale(1.12)}
.ph.has-img img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.ph.has-img[tabindex]:hover img{transform:scale(1.03)}}
dialog.lb{border:0;padding:0;margin:0;width:100%;height:100%;max-width:none;max-height:none;background:rgba(10,14,13,.94);color:#fff}
dialog.lb[open]{display:flex;flex-direction:column}
dialog.lb::backdrop{background:transparent}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.lb-cap{font-size:.8125rem;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-ctrls{display:flex;gap:6px;flex:none}
.lb .ib{font:inherit;font-size:.8125rem;height:36px;min-width:36px;padding:0 12px;border-radius:999px;cursor:pointer;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.32)}
.lb .ib:hover{border-color:#fff}
.lb .ib.x{background:#fff;color:#111615;border-color:#fff}
.lb-stage{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-stage img{display:block;width:100%;height:100%;object-fit:contain}

/* video details: images stacked one per row at full width */
.sheet-in[data-cat="video"] .thumbs{grid-template-columns:1fr;gap:10px;margin-top:10px}
.sheet-in[data-cat="video"] .mcol{position:static}
.sheet-in[data-cat="video"] .thumbs .ph::after{width:28px;height:28px;right:10px;bottom:10px;font-size:15px}

/* rows never stretch */
.tcol,.dhead,.mcol{align-content:start}
.links a{display:inline-flex;align-items:center;line-height:1.4}

/* strengths summary */
.strengths{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.strengths li{min-width:0}
.strengths a{display:grid;gap:8px;height:100%;padding:20px 22px;border-radius:var(--r);background:var(--tint);color:var(--ink);text-decoration:none;transition:background .2s,transform .2s}
.strengths a:hover{background:var(--accent);color:var(--on-accent,#fff);transform:translateY(-2px)}
.strengths b{font-size:1.0625rem;font-weight:900;letter-spacing:-.01em}
.strengths span{font-size:.875rem;line-height:1.6;color:inherit;opacity:.85}
.strengths i{font-style:normal;font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.04em;opacity:.7;margin-top:4px}

/* why marketing */
.why{display:grid;gap:10px}
.why p{color:var(--soft);font-size:.9375rem;line-height:1.75;max-width:62ch}
.why .lead-p{color:var(--ink);font-size:clamp(1.0625rem,2vw,1.25rem);font-weight:700;line-height:1.5;letter-spacing:-.01em}

body{overflow-x:clip}
.progress{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:50;background:var(--accent);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:45;pointer-events:none}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px}
.pill{pointer-events:auto;font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.06em;color:var(--ink);text-decoration:none;
  background:rgba(255,255,255,.88);padding:7px 13px;border-radius:999px;border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill.logo{font-family:var(--f-latin);font-weight:700;letter-spacing:.04em;flex:none}

/* dot nav */
.dots{position:fixed;right:max(18px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:44;display:none;flex-direction:column;gap:12px}
@media (min-width:1100px){.dots{display:flex}}
.dots a{position:relative;display:block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);transition:transform .25s,background .25s}
.dots a.on{background:var(--accent);border-color:var(--accent);transform:scale(1.3)}
.dots a span{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:.75rem;white-space:nowrap;background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
.dots a:hover span,.dots a:focus-visible span{opacity:1}

/* pinned scenes */
.pin{position:relative}
.stage{position:sticky;top:0;height:var(--vh);overflow:hidden}

/* hero */
.hero{height:calc(var(--vh) * 1.5)}
.hero .stage{display:grid;place-items:center}
.names{position:relative;z-index:2;width:100%;font-family:var(--f-latin);font-weight:800;font-size:clamp(3rem,15.5vw,13rem);line-height:.88;letter-spacing:-.045em;display:grid;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.names span{display:block;will-change:transform}
.names .a,.names .b{transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
.names .b{text-align:right;color:var(--accent)}
.hero.open .names .a{transform:translateX(-62vw)}
.hero.open .names .b{transform:translateX(62vw)}
.frame{position:absolute;inset:0;z-index:1;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;text-align:center;
  clip-path:inset(46% 47% round 999px);transition:clip-path 1.25s cubic-bezier(.7,0,.2,1) .12s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero.open .frame{clip-path:inset(0% 0% round 0px)}
.frame .in{opacity:0;transform:translateY(24px);transition:opacity .7s ease .95s,transform .7s cubic-bezier(.2,.7,.2,1) .95s;display:grid;gap:18px;justify-items:center}
.hero.open .frame .in{opacity:1;transform:none}
.frame .k{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.16em}
.frame h2{font-size:clamp(2rem,6.4vw,5rem);font-weight:900;line-height:1.15;letter-spacing:-.035em}
.frame p{font-size:clamp(.9375rem,1.5vw,1.0625rem);max-width:36ch;opacity:.92}
.hint{position:absolute;z-index:3;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;
  font-family:var(--f-mono);font-size:.6875rem;letter-spacing:.14em;color:var(--muted);transition:opacity .3s}
.hint i{width:1px;height:40px;background:linear-gradient(var(--ink),transparent);animation:drip 1.8s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
.tagline{position:absolute;z-index:3;left:0;right:0;top:calc(72px + env(safe-area-inset-top,0px));text-align:center;font-size:.8125rem;color:var(--muted);transition:opacity .3s}
.hero.open .hint,.hero.open .tagline{opacity:0}

/* statement */
.statement .wrap{padding-block:clamp(80px,13vw,180px) clamp(40px,6vw,72px)}
.str-sec .wrap{padding-block:0 clamp(56px,8vw,96px);display:grid;gap:14px}
.str-k{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.statement p{font-size:clamp(1.5rem,4.2vw,3.25rem);font-weight:700;line-height:1.45;letter-spacing:-.025em;max-width:24ch}
.statement .w{color:var(--dim);transition:color .3s}
.statement .w.on{color:var(--ink)}
.statement .w.hl.on{color:var(--accent)}

/* band */
.band{border-block:1px solid var(--line);overflow:hidden;padding-block:18px}
.band .row{display:flex;width:max-content;white-space:nowrap;animation:marquee 38s linear infinite;font-family:var(--f-latin);font-weight:500;font-size:clamp(1.25rem,3vw,2rem);letter-spacing:-.01em;will-change:transform}
.band .row span{padding-right:40px}
.band .row span::after{content:"";display:inline-block;width:.35em;height:.35em;border-radius:50%;background:var(--accent);margin-left:40px;vertical-align:.18em}
.band:hover .row{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-33.3333%)}}
.band.rev .row{color:var(--dim)}

/* category headers */
.cat{padding-block:clamp(88px,13vw,180px) clamp(24px,4vw,48px);overflow:hidden}
.cat .big{font-size:clamp(2.75rem,10vw,8rem);font-weight:900;letter-spacing:-.05em;line-height:1;white-space:nowrap;
  transform:translateX(calc((1 - var(--v,1)) * 22%));opacity:calc(.25 + var(--v,1) * .75)}
.cat .bar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:2px solid var(--ink);margin-top:20px;padding-top:14px;font-size:.875rem;color:var(--soft)}
.cat .bar .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}

/* 3D sequence */
.seq{height:calc(var(--vh) * 4)}
.seq .stage{display:grid;align-content:center}
.seq .grid{display:grid;gap:24px;align-items:center}
@media (min-width:900px){.seq .grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:64px}}
.layers{position:relative;width:min(100%,calc(var(--vh) * .46));aspect-ratio:1;margin-inline:auto}
@media (min-width:900px){.layers{width:min(100%,calc(var(--vh) * .66))}}
.layers .ph{position:absolute;inset:0;aspect-ratio:auto;border-radius:24px;transition:opacity .45s,transform .6s cubic-bezier(.2,.7,.2,1)}
.layers .ph span{font-size:.8125rem}
.layers .ph:not(.on){opacity:0;transform:scale(.94) rotate(-2deg);pointer-events:none}
.layers .ph.done{opacity:0;transform:scale(1.04) rotate(1deg)}
.layers .badge{position:absolute;z-index:2;top:16px;right:16px;font-family:var(--f-mono);font-size:.75rem;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:999px}
.ssteps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ssteps li{display:grid;grid-template-columns:3rem 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line);color:var(--dim);transition:color .35s}
.ssteps li .no{font-family:var(--f-num);font-weight:700;font-size:1rem}
.ssteps li b{display:block;font-size:clamp(1.125rem,2.2vw,1.5rem);font-weight:900;letter-spacing:-.02em;line-height:1.3}
.ssteps li p{font-size:.875rem;margin-top:4px}
.ssteps li.on{color:var(--ink)}
.ssteps li.on .no{color:var(--accent)}
.ssteps li.on p{color:var(--soft)}
@media (max-width:899px){.ssteps li{padding:8px 0}.ssteps li:not(.on) p{display:none}}
.seq-head{display:grid;gap:6px;margin-bottom:8px}
.seq-head .meta{font-family:var(--f-mono);font-size:.75rem;color:var(--accent-ink)}
.seq-head h3{font-size:clamp(1.375rem,3vw,2.25rem);font-weight:900;letter-spacing:-.03em;line-height:1.25}
.meter{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(var(--s,0))}

/* chapters */
.ch{padding-block:clamp(40px,6vw,80px)}
.ch .wrap{display:grid;gap:28px}
@media (min-width:900px){.ch .wrap{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px}
  .ch .mcol{position:sticky;top:96px;align-self:start}}
.ch + .ch .wrap{border-top:1px solid var(--line);padding-top:clamp(40px,6vw,80px)}
.ch + .ch{padding-top:0}
.ch.flip .wrap{direction:rtl}.ch.flip .wrap>*{direction:ltr}
.reveal .ph:first-child{clip-path:inset(calc((1 - var(--v,1)) * 38%) 0 0 0 round 14px);transform:scale(calc(1.08 - var(--v,1) * .08))}
.ch.solo .wrap{grid-template-columns:1fr}
.ch.solo .tcol{max-width:none}
@media (min-width:900px){.ch.solo .tcol{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;display:grid}}
.dhead{display:grid;gap:8px;align-content:start}
.dhead .meta{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.75rem}
.dhead .meta .c{color:var(--accent-ink)}
.dhead .meta .y{color:var(--muted)}
.dhead h3{font-size:clamp(1.5rem,3.4vw,2.375rem);font-weight:900;line-height:1.25;letter-spacing:-.03em}
.dhead .lead{font-size:clamp(1rem,1.5vw,1.125rem);color:var(--soft);font-weight:500}
.dhead .sub{color:var(--muted);font-size:.875rem}
.dhead .role{justify-self:start;margin-top:6px;font-size:.8125rem;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--ink);color:var(--bg)}
.tcol{display:grid;gap:26px;min-width:0;max-width:68ch}

/* process line */
.dbody .steps{list-style:none;padding:0;position:relative;gap:0;counter-reset:s}
.dbody .steps::before{content:"";position:absolute;left:11px;top:12px;bottom:12px;width:2px;background:var(--line)}
.dbody .steps::after{content:"";position:absolute;left:11px;top:12px;width:2px;height:calc((100% - 24px) * var(--v,1));background:var(--accent)}
.dbody .steps li{position:relative;padding:10px 0 10px 40px;counter-increment:s;transition:color .3s}

    var sp = pinP(seq), si = Math.min(3, Math.floor(sp * 4));
    layers.forEach(function(l, k){ l.classList.toggle("on", k === si); l.classList.toggle("done", k < si); });
    ssteps.forEach(function(l, k){ l.classList.toggle("on", k === si - 1); });
    $("badge").textContent = si === 0 ? "완성본" : "0" + si + " / 03";
    $("smeter").style.setProperty("--s", sp.toFixed(4));

    // view progress (enter → 60% up the screen)
    views.forEach(function(el){
      var rr = el.getBoundingClientRect();
      el.style.setProperty("--v", reduce ? 1 : clamp((vh - rr.top) / (vh * .6)).toFixed(4));
    });
    stepLis.forEach(function(li){ li.classList.toggle("on", reduce || li.getBoundingClientRect().top < vh * .62); });

    // header label + dots
    var label = "PORTFOLIO 2026";
    marks.forEach(function(m){ if (m.getBoundingClientRect().top < vh * .4) label = m.dataset.where; });
    if (where.textContent !== label) where.textContent = label;
    var act = 0;
    dotSecs.forEach(function(s, k){ if (s.getBoundingClientRect().top < vh * .5) act = k; });
    dots.forEach(function(d, k){ d.classList.toggle("on", k === act); });
  }
  function req(){ if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  addEventListener("scroll", req, {passive:true});
  addEventListener("resize", req);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(req);
  update();
  initLightbox();
})();
</script>

</body>
</html>
